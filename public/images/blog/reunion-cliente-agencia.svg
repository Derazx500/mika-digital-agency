<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Comparación entre una primera llamada donde la agencia pregunta y otra donde solo se presenta">
  <defs>
    <style>
      .t { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .h { font-size: 44px; font-weight: 600; fill: #0a0a0a; letter-spacing: -1.2px; }
      .sub { font-size: 23px; fill: #6b7280; }
      .head { font-size: 25px; font-weight: 700; }
      .q { font-size: 22px; fill: #1f2937; }
      .cap { font-size: 20px; fill: #9ca3af; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <text class="t h" x="90" y="112">La primera llamada lo dice casi todo</text>
  <text class="t sub" x="90" y="156">Quién hace las preguntas revela cómo va a ser el proyecto</text>

  <!-- Buena señal -->
  <g>
    <rect x="90" y="210" width="680" height="600" rx="20" fill="#f5f9ff" stroke="#bfdbfe" stroke-width="3"/>
    <text class="t head" x="126" y="270" fill="#0167f3">Buena señal: preguntan</text>

    <g>
      <rect x="126" y="300" width="608" height="72" rx="14" fill="#ffffff" stroke="#e0edff" stroke-width="2"/>
      <text class="t q" x="152" y="344">«¿Quién es tu cliente ideal?»</text>

      <rect x="126" y="388" width="608" height="72" rx="14" fill="#ffffff" stroke="#e0edff" stroke-width="2"/>
      <text class="t q" x="152" y="432">«¿Contra quién compites?»</text>

      <rect x="126" y="476" width="608" height="72" rx="14" fill="#ffffff" stroke="#e0edff" stroke-width="2"/>
      <text class="t q" x="152" y="520">«¿Qué quieres que haga el visitante?»</text>

      <rect x="126" y="564" width="608" height="72" rx="14" fill="#ffffff" stroke="#e0edff" stroke-width="2"/>
      <text class="t q" x="152" y="608">«¿Cómo mides que funcionó?»</text>

      <rect x="126" y="652" width="608" height="72" rx="14" fill="#ffffff" stroke="#e0edff" stroke-width="2"/>
      <text class="t q" x="152" y="696">«¿Qué no está funcionando hoy?»</text>
    </g>

    <text class="t q" x="126" y="778" fill="#0167f3">→ El diseño va a ser una herramienta</text>
  </g>

  <!-- Mala señal -->
  <g>
    <rect x="830" y="210" width="680" height="600" rx="20" fill="#fafafa" stroke="#e5e7eb" stroke-width="3"/>
    <text class="t head" x="866" y="270" fill="#9ca3af">Mala señal: solo se presentan</text>

    <g>
      <rect x="866" y="300" width="608" height="72" rx="14" fill="#ffffff" stroke="#f0f0f0" stroke-width="2"/>
      <text class="t q" x="892" y="344" fill="#9ca3af">«Somos líderes en el mercado»</text>

      <rect x="866" y="388" width="608" height="72" rx="14" fill="#ffffff" stroke="#f0f0f0" stroke-width="2"/>
      <text class="t q" x="892" y="432" fill="#9ca3af">«Trabajamos con tecnología de punta»</text>

      <rect x="866" y="476" width="608" height="72" rx="14" fill="#ffffff" stroke="#f0f0f0" stroke-width="2"/>
      <text class="t q" x="892" y="520" fill="#9ca3af">«Te garantizamos el primer lugar»</text>

      <rect x="866" y="564" width="608" height="72" rx="14" fill="#ffffff" stroke="#f0f0f0" stroke-width="2"/>
      <text class="t q" x="892" y="608" fill="#9ca3af">«El precio es solo si firmas hoy»</text>

      <rect x="866" y="652" width="608" height="72" rx="14" fill="#ffffff" stroke="#f0f0f0" stroke-width="2"/>
      <text class="t q" x="892" y="696" fill="#9ca3af">«Ya tenemos una plantilla ideal»</text>
    </g>

    <text class="t q" x="866" y="778" fill="#9ca3af">→ El diseño va a ser decoración</text>
  </g>

  <text class="t cap" x="90" y="858">Si en la primera llamada solo hablaron ellos, ya sabes cómo va a terminar.</text>
</svg>

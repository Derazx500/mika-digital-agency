<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Portada: cuánto cuesta una página web en México">
  <defs>
    <style>
      .t { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .kicker { font-size: 24px; font-weight: 600; fill: #0167f3; letter-spacing: 3px; }
      .h { font-size: 76px; font-weight: 600; fill: #0a0a0a; letter-spacing: -2.5px; }
      .tier { font-size: 22px; fill: #6b7280; }
      .price { font-size: 34px; font-weight: 700; fill: #0a0a0a; letter-spacing: -0.8px; }
    </style>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0167f3" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#0167f3" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <rect width="1600" height="900" fill="url(#g)"/>

  <text class="t kicker" x="110" y="150">PRECIOS 2026</text>
  <text class="t h" x="110" y="252">¿Cuánto cuesta</text>
  <text class="t h" x="110" y="336">una página web</text>
  <text class="t h" x="110" y="420">en México?</text>

  <!-- Escalones de precio -->
  <g>
    <rect x="110" y="530" width="420" height="120" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
    <text class="t tier"  x="142" y="578">Landing page</text>
    <text class="t price" x="142" y="622">desde $9,500</text>

    <rect x="562" y="530" width="420" height="160" rx="16" fill="#ffffff" stroke="#0167f3" stroke-width="3"/>
    <text class="t tier"  x="594" y="578">Sitio corporativo</text>
    <text class="t price" x="594" y="622">desde $18,000</text>
    <rect x="594" y="644" width="150" height="28" rx="7" fill="#eaf2ff"/>
    <text class="t" x="608" y="664" font-size="17" font-weight="600" fill="#0167f3">MÁS CONTRATADO</text>

    <rect x="1014" y="530" width="420" height="120" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
    <text class="t tier"  x="1046" y="578">Tienda en línea</text>
    <text class="t price" x="1046" y="622">desde $35,000</text>
  </g>

  <text class="t tier" x="110" y="790">Qué incluye cada rango y qué encarece de verdad un proyecto</text>

  <!-- Acento de marca -->
  <circle cx="1470" cy="150" r="26" fill="#0167f3"/>
  <path d="M1380 122h60l-30 56z" fill="#0167f3" opacity="0.55"/>
</svg>

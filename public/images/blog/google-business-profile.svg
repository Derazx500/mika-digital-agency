<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Ficha de Google Business Profile completa frente a una incompleta">
  <defs>
    <style>
      .t { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .h { font-size: 44px; font-weight: 600; fill: #0a0a0a; letter-spacing: -1.2px; }
      .sub { font-size: 23px; fill: #6b7280; }
      .card-h { font-size: 24px; font-weight: 700; fill: #0a0a0a; }
      .row { font-size: 21px; fill: #374151; }
      .row-off { font-size: 21px; fill: #9ca3af; }
      .tag { font-size: 19px; font-weight: 600; }
      .cap { font-size: 20px; fill: #9ca3af; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>

  <text class="t h" x="90" y="112">Tu ficha de Google, completa vs. a medias</text>
  <text class="t sub" x="90" y="156">Es la señal que más pesa para aparecer en el mapa</text>

  <!-- Ficha completa -->
  <g>
    <rect x="90" y="210" width="680" height="600" rx="20" fill="#ffffff" stroke="#d1fae5" stroke-width="3"/>
    <rect x="90" y="210" width="680" height="66" rx="20" fill="#ecfdf5"/>
    <rect x="90" y="256" width="680" height="20" fill="#ecfdf5"/>
    <text class="t tag" x="122" y="252" fill="#047857">FICHA COMPLETA · aparece en el mapa</text>

    <text class="t card-h" x="122" y="326">Mika Digital Agency</text>

    <g fill="#059669">
      <circle cx="134" cy="374" r="10"/><circle cx="134" cy="424" r="10"/>
      <circle cx="134" cy="474" r="10"/><circle cx="134" cy="524" r="10"/>
      <circle cx="134" cy="574" r="10"/><circle cx="134" cy="624" r="10"/>
      <circle cx="134" cy="674" r="10"/><circle cx="134" cy="724" r="10"/>
    </g>
    <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M129 374l4 4 7-8"/><path d="M129 424l4 4 7-8"/>
      <path d="M129 474l4 4 7-8"/><path d="M129 524l4 4 7-8"/>
      <path d="M129 574l4 4 7-8"/><path d="M129 624l4 4 7-8"/>
      <path d="M129 674l4 4 7-8"/><path d="M129 724l4 4 7-8"/>
    </g>

    <text class="t row" x="166" y="382">Categoría principal correcta</text>
    <text class="t row" x="166" y="432">Horario y teléfono verificados</text>
    <text class="t row" x="166" y="482">Zona de servicio definida</text>
    <text class="t row" x="166" y="532">Lista de servicios completa</text>
    <text class="t row" x="166" y="582">Fotos reales, subidas cada mes</text>
    <text class="t row" x="166" y="632">Publicaciones activas</text>
    <text class="t row" x="166" y="682">Reseñas nuevas y respondidas</text>
    <text class="t row" x="166" y="732">Preguntas frecuentes contestadas</text>

    <rect x="122" y="756" width="616" height="30" rx="8" fill="#ecfdf5"/>
    <text class="t tag" x="138" y="778" fill="#047857">Aparece en el local pack</text>
  </g>

  <!-- Ficha incompleta -->
  <g>
    <rect x="830" y="210" width="680" height="600" rx="20" fill="#ffffff" stroke="#e5e7eb" stroke-width="3"/>
    <rect x="830" y="210" width="680" height="66" rx="20" fill="#f9fafb"/>
    <rect x="830" y="256" width="680" height="20" fill="#f9fafb"/>
    <text class="t tag" x="862" y="252" fill="#9ca3af">FICHA A MEDIAS · invisible en el mapa</text>

    <text class="t card-h" x="862" y="326">Nombre del negocio</text>

    <g fill="#059669">
      <circle cx="874" cy="374" r="10"/><circle cx="874" cy="424" r="10"/>
    </g>
    <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M869 374l4 4 7-8"/><path d="M869 424l4 4 7-8"/>
    </g>
    <g fill="none" stroke="#d1d5db" stroke-width="2.5">
      <circle cx="874" cy="474" r="10"/><circle cx="874" cy="524" r="10"/>
      <circle cx="874" cy="574" r="10"/><circle cx="874" cy="624" r="10"/>
      <circle cx="874" cy="674" r="10"/><circle cx="874" cy="724" r="10"/>
    </g>

    <text class="t row" x="906" y="382">Nombre</text>
    <text class="t row" x="906" y="432">Teléfono</text>
    <text class="t row-off" x="906" y="482">Categoría genérica o equivocada</text>
    <text class="t row-off" x="906" y="532">Sin zona de servicio</text>
    <text class="t row-off" x="906" y="582">Sin fotos desde hace dos años</text>
    <text class="t row-off" x="906" y="632">Sin publicaciones</text>
    <text class="t row-off" x="906" y="682">Reseñas viejas, sin responder</text>
    <text class="t row-off" x="906" y="732">Preguntas sin contestar</text>

    <rect x="862" y="756" width="616" height="30" rx="8" fill="#f9fafb"/>
    <text class="t tag" x="878" y="778" fill="#9ca3af">No entra al local pack</text>
  </g>

  <text class="t cap" x="90" y="858">Completar la ficha es lo más barato que puedes hacer por tu SEO local.</text>
</svg>

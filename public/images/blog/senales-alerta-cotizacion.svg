<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Cinco señales de alerta en una cotización de diseño web">
  <defs>
    <style>
      .t { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .h { font-size: 46px; font-weight: 600; fill: #0a0a0a; letter-spacing: -1.2px; }
      .sub { font-size: 24px; fill: #6b7280; }
      .lbl { font-size: 27px; font-weight: 600; fill: #0a0a0a; }
      .desc { font-size: 21px; fill: #6b7280; }
      .num { font-size: 22px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <rect x="0" y="0" width="1600" height="900" fill="none" stroke="#eef1f6" stroke-width="2"/>

  <text class="t h" x="90" y="120">Cinco señales de alerta</text>
  <text class="t sub" x="90" y="164">Revísalas antes de firmar cualquier cotización</text>

  <g>
    <rect x="90" y="216" width="1420" height="112" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <circle cx="146" cy="272" r="24" fill="#ea580c"/>
    <text class="t num" x="146" y="281" text-anchor="middle">1</text>
    <text class="t lbl" x="196" y="264">No especifica páginas ni rondas de ajuste</text>
    <text class="t desc" x="196" y="299">Es la puerta de entrada a los cobros extra</text>

    <rect x="90" y="344" width="1420" height="112" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <circle cx="146" cy="400" r="24" fill="#ea580c"/>
    <text class="t num" x="146" y="409" text-anchor="middle">2</text>
    <text class="t lbl" x="196" y="392">No menciona el plazo de entrega</text>
    <text class="t desc" x="196" y="427">O peor: promete una semana para un sitio corporativo</text>

    <rect x="90" y="472" width="1420" height="112" rx="16" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <circle cx="146" cy="528" r="24" fill="#dc2626"/>
    <text class="t num" x="146" y="537" text-anchor="middle">3</text>
    <text class="t lbl" x="196" y="520">Se queda con el dominio o el hosting a su nombre</text>
    <text class="t desc" x="196" y="555">Esto te deja secuestrado. Debe estar a tu nombre, siempre</text>

    <rect x="90" y="600" width="1420" height="112" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <circle cx="146" cy="656" r="24" fill="#ea580c"/>
    <text class="t num" x="146" y="665" text-anchor="middle">4</text>
    <text class="t lbl" x="196" y="648">No incluye capacitación</text>
    <text class="t desc" x="196" y="683">Vas a depender de ellos para cada cambio de texto</text>

    <rect x="90" y="728" width="1420" height="112" rx="16" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <circle cx="146" cy="784" r="24" fill="#dc2626"/>
    <text class="t num" x="146" y="793" text-anchor="middle">5</text>
    <text class="t lbl" x="196" y="776">Promete «primer lugar en Google incluido»</text>
    <text class="t desc" x="196" y="811">Nadie puede garantizar eso. Quien lo promete, miente</text>
  </g>
</svg>

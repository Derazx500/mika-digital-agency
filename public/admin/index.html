<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- El panel nunca debe aparecer en Google. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Panel de contenido — Mika Digital Agency</title>
    <link rel="icon" href="/favicon.ico" />
  </head>
  <body>
    <!--
      Decap CMS se carga desde su CDN. Es la forma que recomiendan y mantiene
      el panel actualizado sin tener que recompilar el sitio.
      La versión está fijada a propósito: así una actualización del CDN no
      puede romper el panel sin avisar.
    -->
    <script src="https://unpkg.com/decap-cms@3.8.4/dist/decap-cms.js"></script>
  </body>
</html>

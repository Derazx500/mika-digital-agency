# =====================================================================
# Panel de administración de Mika Digital Agency (Decap CMS)
#
# Este archivo define qué se puede editar desde mikadigitalagency.com/admin.
# Al guardar un cambio, Decap hace un commit en GitHub y Vercel recompila y
# publica el sitio solo, en aproximadamente un minuto.
#
# El repositorio tiene que existir en GitHub y llamarse exactamente igual que
# lo que dice `repo`. Si le pones otro nombre al crearlo, cámbialo aquí.
# =====================================================================

backend:
  name: github
  repo: Derazx500/mika-digital-agency
  branch: main
  # Proxy OAuth incluido en este mismo proyecto (src/app/api/auth), para no
  # depender de Netlify al iniciar sesión.
  #
  # `base_url` NO se pone aquí: lo calcula index.html a partir del origen
  # actual. Si se escribiera fijo, el login se enviaría siempre a ese dominio
  # aunque el sitio esté respondiendo en otro (la URL de Vercel, por ejemplo)
  # y devolvería un 404.
  auth_endpoint: api/auth

# Permite editar en local con `npx decap-server` sin tocar GitHub.
local_backend: true

# Idioma del panel
locale: es

# Marca en la pantalla de inicio de sesión.
logo_url: https://mikadigitalagency.com/logo/mika-logo.png

# Enlace de vuelta al sitio desde la cabecera del panel.
site_url: https://mikadigitalagency.com
display_url: mikadigitalagency.com

media_folder: public/images/uploads
public_folder: /images/uploads

# Los borradores se guardan como Pull Request en GitHub en vez de publicarse
# directo. Útil para revisar antes de que salga en vivo.
publish_mode: simple

collections:
  # -----------------------------------------------------------------
  # BLOG
  # -----------------------------------------------------------------
  - name: blog
    label: Artículos del blog
    label_singular: Artículo
    folder: content/blog
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    preview_path: 'blog/{{slug}}'
    summary: '{{title}} — {{date | date("d/MM/yyyy")}}'
    sortable_fields: ['date', 'title']
    view_filters:
      - label: Borradores
        field: draft
        pattern: true
    fields:
      - label: Título
        name: title
        widget: string
        hint: El titular que se ve en la página. Sin límite estricto de largo.

      - label: Título para Google (SEO)
        name: seoTitle
        widget: string
        required: false
        pattern: ['^.{0,60}$', 'Máximo 60 caracteres: Google corta lo que sobra.']
        hint: >-
          Aparece en el resultado de búsqueda. Máximo 60 caracteres, con la
          palabra clave al principio. Si lo dejas vacío se usa el título.

      - label: Meta descripción
        name: description
        widget: text
        pattern:
          ['^.{50,165}$', 'Entre 50 y 165 caracteres. Ahora tiene otro número.']
        hint: >-
          El texto gris bajo el título en Google. Entre 150 y 160 caracteres es
          lo ideal. No cambia el ranking, pero sí cuánta gente hace clic.

      - label: Fecha de publicación
        name: date
        widget: datetime
        date_format: 'DD/MM/YYYY'
        time_format: false
        picker_utc: true

      - label: Autor
        name: author
        widget: string
        default: 'Mika Digital Agency'

      - label: Categoría
        name: category
        widget: select
        options:
          - Diseño web
          - SEO
          - E-commerce
          - Branding
          - Guías
          - Casos de estudio
          - Nuevas tecnologías

      - label: Palabra clave objetivo
        name: keyword
        widget: string
        required: false
        hint: >-
          Solo para uso interno, no se muestra. Sirve para no escribir dos
          artículos que compitan entre sí por la misma búsqueda.

      - label: Imagen de portada
        name: cover
        widget: image
        media_library:
          config:
            max_file_size: 2000000
        hint: >-
          1600 × 900 px. También es la miniatura que aparece al compartir el
          artículo en WhatsApp. Sube WebP o JPG optimizado.

      - label: Descripción de la portada
        name: coverAlt
        widget: string
        hint: >-
          Describe lo que se ve en la imagen. Lo leen Google y los lectores de
          pantalla. Ejemplo: "Equipo revisando el diseño de un sitio web".

      - label: Fecha de última revisión
        name: updated
        widget: datetime
        date_format: 'DD/MM/YYYY'
        time_format: false
        picker_utc: true
        required: false
        hint: >-
          Actualízala cuando revises el artículo. Google la usa como señal de
          frescura: un texto revisado hace un mes compite mejor que uno de
          hace dos años. Si la dejas vacía se usa la de publicación.

      - label: Borrador
        name: draft
        widget: boolean
        default: false
        required: false
        hint: Si está activado, el artículo no se publica ni entra al sitemap.

      - label: Contenido
        name: body
        widget: markdown
        hint: >-
          Usa "Cita" para las cajas destacadas azules. Para insertar una imagen
          dentro del texto usa el botón de imagen y escribe el pie en el campo
          "título".

      - label: Preguntas frecuentes
        name: faqs
        label_singular: Pregunta
        widget: list
        required: false
        collapsed: false
        summary: '{{fields.q}}'
        hint: >-
          Lo que más rinde en SEO de todo este formulario. Se muestran al final
          del artículo y se envían a Google como datos estructurados, que es lo
          que permite que aparezcan desplegables en el resultado de búsqueda y
          te ocupen más espacio que la competencia. Con 4 o 5 basta.
        fields:
          - label: Pregunta
            name: q
            widget: string
            hint: >-
              Escríbela tal como la teclearía alguien en Google, con sus
              palabras. "¿Cuánto cuesta una tienda en línea?" funciona;
              "Sobre nuestros precios" no.
          - label: Respuesta
            name: a
            widget: text
            hint: >-
              Responde de verdad y en las primeras dos líneas. Entre 40 y 60
              palabras. Google solo muestra respuestas que resuelven la duda
              sin rodeos.

  # -----------------------------------------------------------------
  # PORTAFOLIO
  # -----------------------------------------------------------------
  - name: proyectos
    label: Proyectos del portafolio
    label_singular: Proyecto
    folder: content/proyectos
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    preview_path: 'portafolio/{{slug}}'
    summary: '{{name}} — {{year}}'
    sortable_fields: ['order', 'year', 'name']
    fields:
      - label: Nombre del cliente
        name: name
        widget: string

      - label: Giro del cliente
        name: industry
        widget: string
        hint: >-
          El giro exacto, como lo diría el cliente. Ej: Artes escénicas,
          Servicios industriales. Se muestra en la ficha del proyecto.

      - label: Tipo de proyecto (para el filtro)
        name: categorias
        widget: select
        multiple: true
        options:
          - Diseño web
          - Branding
          - E-commerce
          - SEO
          - Redes sociales
          - Fotografía
          - Video
        hint: >-
          Con esto se filtra el portafolio. Marca todas las que apliquen: un
          proyecto puede ser de web y de branding a la vez, y aparecerá en los
          dos filtros. Quien entra al portafolio busca "¿han hecho branding?",
          no el giro del cliente.

      - label: Año
        name: year
        widget: string
        pattern: ['^\d{4}$', 'Cuatro dígitos, ej. 2025.']

      - label: Resumen
        name: summary
        widget: text
        hint: >-
          Una o dos líneas que se ven en la tarjeta del portafolio. Di el
          resultado, no adjetivos: "Sitio que triplicó las solicitudes de
          cotización" convence más que "sitio moderno y atractivo".

      - label: Servicios aplicados
        name: tags
        widget: list
        default: ['Diseño web']
        hint: 'Ej: Diseño web, SEO, Branding, E-commerce.'

      - label: Imagen principal
        name: image
        widget: image
        hint: '1320 × 990 px (apaisada) o 1200 × 1200 px (cuadrada).'

      - label: Formato de la tarjeta
        name: aspect
        widget: select
        options:
          - { label: Apaisada, value: wide }
          - { label: Cuadrada, value: square }
        default: wide
        hint: >-
          Alterna apaisada y cuadrada entre proyectos consecutivos: la
          retícula se ve mucho mejor.

      - label: Mostrar en la portada
        name: featured
        widget: boolean
        default: false
        hint: Los proyectos destacados aparecen en la home. Recomendado, 4.

      - label: Orden
        name: order
        widget: number
        value_type: int
        default: 10
        hint: Menor número, aparece antes en el portafolio.

      - label: Sitio en vivo
        name: url
        widget: string
        required: false
        hint: URL del sitio publicado, si sigue en línea.

      - label: Borrador
        name: draft
        widget: boolean
        default: false
        required: false

      - label: Reseña del cliente
        name: resena
        widget: text
        required: false
        hint: >-
          Opcional. Si este cliente te dejó una reseña, pégala aquí tal cual
          y aparecerá al final de la ficha. Si no dejó ninguna, déjalo vacío:
          la sección simplemente no se muestra. No la inventes ni la pulas —
          una reseña que suena a texto de agencia se nota y resta.

      - label: Quién la dejó
        name: resenaAutor
        widget: string
        required: false
        hint: >-
          Nombre de la persona. Hace falta para que la reseña se muestre: una
          cita sin nombre no da confianza, la quita.

      - label: Su puesto y empresa
        name: resenaPuesto
        widget: string
        required: false
        hint: 'Ej: Directora de Marketing, Nombre de la empresa.'

      - label: Caso de estudio
        name: body
        widget: markdown
        hint: >-
          Escribe El reto / Lo que hicimos / Resultados. Los números concretos
          (más solicitudes, menos tiempo de carga, posiciones ganadas) son lo
          que de verdad convierte.

  # -----------------------------------------------------------------
  # RESEÑAS
  # -----------------------------------------------------------------
  - name: testimonios
    label: Reseñas de clientes
    label_singular: Reseña
    folder: content/testimonios
    create: true
    slug: '{{author}}'
    extension: md
    format: frontmatter
    summary: '{{author}} — {{company}}'
    sortable_fields: ['order', 'author']
    fields:
      - label: Nombre del cliente
        name: author
        widget: string

      - label: Puesto
        name: role
        widget: string
        required: false
        hint: 'Ej: CEO, Directora de Marketing.'

      - label: Empresa
        name: company
        widget: string
        required: false

      - label: Servicios a los que aplica
        name: servicios
        widget: select
        multiple: true
        required: false
        options:
          - { label: Diseño y desarrollo web, value: diseno-web }
          - { label: Posicionamiento SEO, value: posicionamiento-seo }
          - { label: Diseño gráfico y branding, value: diseno-grafico-branding }
          - { label: Tienda en línea, value: tienda-en-linea }
          - {
              label: Tarjetas de presentación digitales,
              value: tarjetas-de-presentacion-digitales,
            }
          - { label: Desarrollo a la medida, value: desarrollo-de-software }
          - { label: Producción de video, value: produccion-de-video }
          - { label: Producción de podcast, value: produccion-de-podcast }
          - { label: Fotografía profesional, value: fotografia-profesional }
          - { label: Social media, value: social-media }
        hint: >-
          En la página de cada servicio salen primero sus reseñas. Una reseña
          sobre lo mismo que el visitante está mirando convence bastante más
          que un elogio genérico. Si lo dejas vacío, se puede usar en todas.

      - label: Proyecto relacionado
        name: proyecto
        widget: relation
        collection: proyectos
        search_fields: ['name']
        value_field: '{{slug}}'
        display_fields: ['name']
        required: false

      - label: Calificación
        name: rating
        widget: number
        value_type: int
        default: 5
        min: 1
        max: 5

      - label: Orden
        name: order
        widget: number
        value_type: int
        default: 10
        hint: Menor número, aparece antes.

      - label: Borrador
        name: draft
        widget: boolean
        default: false
        required: false

      - label: La reseña
        name: body
        widget: text
        hint: >-
          Las palabras del cliente, tal cual. No las pulas: una reseña que
          suena a texto de agencia se nota y resta credibilidad en vez de
          sumarla.

  # -----------------------------------------------------------------
  # EQUIPO
  # -----------------------------------------------------------------
  - name: equipo
    label: Equipo
    label_singular: Persona
    folder: content/equipo
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    preview_path: 'equipo/{{slug}}'
    summary: '{{name}} — {{role}}'
    sortable_fields: ['order', 'name']
    fields:
      - label: Nombre
        name: name
        widget: string

      - label: Puesto
        name: role
        widget: string
        hint: 'Ej: Director de Diseño, Desarrollador Web.'

      - label: Foto
        name: photo
        widget: image
        hint: >-
          Vertical, 1200 × 1500 px. Se recorta en 4:5, así que deja aire
          alrededor de la cara. Una foto con fondo neutro funciona mejor que
          una recortada de un evento.

      - label: Descripción corta
        name: shortBio
        widget: text
        pattern:
          ['^.{60,220}$', 'Entre 60 y 220 caracteres. Ahora tiene otro número.']
        hint: >-
          Una o dos líneas. Se ve en la tarjeta de /nosotros y arriba del
          perfil. Di qué haces y qué aportas, no adjetivos.

      - label: WhatsApp propio (solo números)
        name: whatsapp
        widget: string
        required: false
        pattern: ['^$|^[0-9]{10,15}$', 'Solo números, sin signos ni espacios.']
        hint: >-
          Para la tarjeta digital. Con clave de país y sin signos: para México,
          52 y los diez dígitos. Si lo dejas vacío, la tarjeta usa el WhatsApp
          de la agencia.

      - label: Correo propio
        name: email
        widget: string
        required: false
        hint: >-
          También para la tarjeta digital. Vacío = el correo de la agencia.

      - label: Especialidades
        name: specialties
        widget: list
        required: false
        default: []
        hint: >-
          Se muestran como etiquetas. Entre 4 y 6. Concretas: "Identidad de
          marca" dice más que "Diseño".

      - label: Redes y enlaces
        name: socials
        label_singular: Enlace
        widget: list
        required: false
        collapsed: false
        summary: '{{fields.red}}'
        fields:
          - label: Red
            name: red
            widget: select
            options:
              - { label: Instagram, value: instagram }
              - { label: Facebook, value: facebook }
              - { label: LinkedIn, value: linkedin }
              - { label: Behance, value: behance }
              - { label: Dribbble, value: dribbble }
              - { label: TikTok, value: tiktok }
              - { label: WhatsApp, value: whatsapp }
              - { label: Sitio web, value: web }
          - label: Enlace
            name: url
            widget: string
            hint: 'La URL completa, empezando por https://'

      - label: Certificaciones y formación
        name: certifications
        label_singular: Certificación
        widget: list
        required: false
        collapsed: false
        summary: '{{fields.titulo}}'
        hint: >-
          Solo lo verificable. Una certificación falsa o inflada es lo primero
          que un cliente comprueba, y perder la confianza ahí es irreversible.
        fields:
          - label: Título
            name: titulo
            widget: string
            hint: 'Ej: Google Analytics Certification, Licenciatura en Diseño Gráfico.'
          - label: Quién la emite
            name: emisor
            widget: string
            required: false
            hint: 'Ej: Google, Adobe, la universidad.'
          - label: Año
            name: anio
            widget: string
            required: false
            pattern: ['^(\d{4})?$', 'Cuatro dígitos, ej. 2024. O déjalo vacío.']
          - label: Archivo del certificado
            name: archivo
            widget: file
            required: false
            media_folder: '/public/documentos'
            public_folder: '/documentos'
            hint: >-
              PDF o imagen del certificado. Opcional, pero poder abrirlo
              convierte una afirmación en una prueba.
          - label: Enlace a la credencial
            name: url
            widget: string
            required: false
            hint: >-
              Si la certificación se verifica en línea, pega aquí ese enlace.
              Tiene prioridad sobre el archivo.

      - label: Proyectos en los que participó
        name: proyectos
        widget: relation
        collection: proyectos
        search_fields: ['name', 'industry']
        value_field: '{{slug}}'
        display_fields: ['name']
        multiple: true
        required: false
        hint: >-
          Busca y selecciona los proyectos del portafolio. Aparecerán en su
          perfil con sus tarjetas. Es lo que convierte "somos una agencia" en
          "esto lo hizo esta persona".

      - label: Orden
        name: order
        widget: number
        value_type: int
        default: 10
        hint: Menor número, aparece antes en /nosotros.

      - label: Borrador
        name: draft
        widget: boolean
        default: false
        required: false

      - label: Su historia
        name: body
        widget: markdown
        hint: >-
          Escribe en primera persona. Cómo llegaste a esto, cómo trabajas y en
          qué eres fuerte. Quien lee esta página está decidiendo si confiarte
          su proyecto, y conecta más el motivo que el currículum.

  # -----------------------------------------------------------------
  # AJUSTES DEL SITIO
  #
  # Textos e imágenes sueltos de páginas concretas. No son una colección
  # —no se crean ni se borran— así que van como archivos fijos: entras,
  # editas y guardas.
  #
  # Cada campo de aquí está conectado a un punto concreto del sitio. Si
  # añades uno nuevo, hay que enlazarlo también en src/lib/ajustes.ts.
  # -----------------------------------------------------------------
  - name: ajustes
    label: Ajustes del sitio
    files:
      # ---------------------------------------------------------------
      - name: imagenes
        label: Imágenes del sitio
        file: content/ajustes/imagenes.json
        description: >-
          Las imágenes que no pertenecen a ningún artículo ni proyecto: el
          logotipo, la miniatura que sale al compartir el enlace y las dos
          fotos del estudio.
        fields:
          - label: Logotipo
            name: logo
            widget: image
            hint: >-
              Aparece en el menú, en el menú móvil y en el pie. Lo ideal es un
              SVG o un PNG con fondo transparente. Si lo cambias, ajusta
              también las dos medidas de abajo.

          - label: Ancho del logotipo (px)
            name: logoAncho
            widget: number
            value_type: int
            hint: >-
              Las medidas reales del archivo. Se usan para calcular la
              proporción: si no coinciden, el logo sale estirado. Las ves al
              abrir la imagen en cualquier visor.

          - label: Alto del logotipo (px)
            name: logoAlto
            widget: number
            value_type: int

          - label: Imagen al compartir (Open Graph)
            name: compartir
            widget: image
            hint: >-
              1200 × 630 px. Es la miniatura que aparece cuando mandas un
              enlace del sitio por WhatsApp, Facebook o LinkedIn. Que se lea
              bien en pequeño: el logo y una frase corta, no un texto largo.

          - label: Foto del estudio 1
            name: estudio1
            widget: image
            hint: >-
              La primera foto de la sección "conoce Mika" de la portada. Casi
              cuadrada, unos 1314 × 1038 px.

          - label: Descripción de la foto 1
            name: estudio1Alt
            widget: string
            hint: >-
              Describe lo que se ve. Lo leen Google y los lectores de pantalla
              de personas ciegas.

          - label: Foto del estudio 2
            name: estudio2
            widget: image
            hint: >-
              La segunda foto de la portada, y también la que ilustra la
              página Nosotros. Apaisada, unos 1800 × 1200 px.

          - label: Descripción de la foto 2
            name: estudio2Alt
            widget: string

      # ---------------------------------------------------------------
      - name: contacto
        label: Contacto y redes
        file: content/ajustes/contacto.json
        description: >-
          Tu teléfono, correo y redes sociales. Se usan en el menú, en el pie,
          en todos los botones de WhatsApp y en los datos que lee Google.
        fields:
          - label: Teléfono (como se muestra)
            name: telefono
            widget: string
            hint: 'Con espacios y prefijo, tal cual quieres que se lea. Ej: +52 55 7495 7155'

          - label: WhatsApp (solo números)
            name: whatsapp
            widget: string
            pattern: ['^[0-9]{10,15}$', 'Solo números, sin signos ni espacios.']
            hint: >-
              Con clave de país y sin signos ni espacios. Para México, 52 y los
              diez dígitos. Es el número al que llevan todos los botones de
              WhatsApp del sitio, así que revísalo dos veces.

          - label: Mensaje que se escribe solo en WhatsApp
            name: mensajeWhatsApp
            widget: text
            hint: >-
              Lo que aparece ya escrito cuando alguien pulsa un botón de
              WhatsApp. Que la persona no tenga que pensar qué escribir sube
              muchísimo las respuestas. Las landings de cada servicio tienen su
              propio mensaje; este es el general.

          - label: Correo electrónico
            name: correo
            widget: string

          - label: Ciudad
            name: ciudad
            widget: string
            hint: Sale en el menú, en la portada y en los datos de negocio local.

          - label: Estado o abreviatura
            name: estado
            widget: string
            hint: 'Ej: CDMX'

          - label: Instagram
            name: instagram
            widget: string
            required: false
            hint: URL completa. Si lo dejas vacío, el icono no aparece.

          - label: Facebook
            name: facebook
            widget: string
            required: false

          - label: LinkedIn
            name: linkedin
            widget: string
            required: false

          - label: Behance
            name: behance
            widget: string
            required: false

      # ---------------------------------------------------------------
      - name: inicio
        label: Página de inicio
        file: content/ajustes/inicio.json
        description: >-
          Los textos de la portada. Los proyectos que se muestran no están
          aquí: se marcan con la casilla "Mostrar en la portada" de cada
          proyecto.
        fields:
          - label: Titular principal
            name: heroTitulo
            widget: text
            hint: >-
              El texto grande de la primera pantalla. Es el titular más
              importante del sitio para Google, así que conviene que lleve
              "diseño web" o "SEO". Cada salto de línea que pongas se respeta
              en computadora; en celular el texto fluye solo.

          - label: Texto del botón principal
            name: heroBoton
            widget: string

          - label: Título de la sección "conoce Mika"
            name: nosotrosTitulo
            widget: text
            hint: Los saltos de línea funcionan igual que en el titular.

          - label: Texto de la sección "conoce Mika"
            name: nosotrosTexto
            widget: text

          - label: Texto del botón de esa sección
            name: nosotrosBoton
            widget: string

          - label: Cifras
            name: estadisticas
            label_singular: Cifra
            widget: list
            collapsed: false
            summary: '{{fields.valor}} — {{fields.etiqueta}}'
            hint: >-
              Salen en la portada y en la página Nosotros. Actualízalas de vez
              en cuando: son de lo poco del sitio que envejece solo.
            fields:
              - { label: Cifra, name: valor, widget: string, hint: 'Ej: 30+' }
              - { label: Qué mide, name: etiqueta, widget: string }

      # ---------------------------------------------------------------
      - name: nosotros
        label: Página Nosotros
        file: content/ajustes/nosotros.json
        description: >-
          Los textos de /nosotros/. Los perfiles del equipo se editan aparte,
          en la sección "Equipo".
        fields:
          - label: Titular de la página
            name: heroTitulo
            widget: string

          - label: Texto de entrada
            name: heroIntro
            widget: text

          - label: Título de la historia
            name: historiaTitulo
            widget: string

